name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm collect:test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test --project=chromium

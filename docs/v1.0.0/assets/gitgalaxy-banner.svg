<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">GitGalaxy</title>
  <desc id="description">A luminous open-source galaxy with orbiting stars.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.48" stop-color="#0B1022"/>
      <stop offset="1" stop-color="#151040"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientTransform="translate(910 146) rotate(136) scale(330 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B7CFA" stop-opacity=".33"/>
      <stop offset=".56" stop-color="#7651DB" stop-opacity=".12"/>
      <stop offset="1" stop-color="#120C31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(911 153) rotate(90) scale(58)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FAFF"/>
      <stop offset=".15" stop-color="#B8D3FF"/>
      <stop offset=".45" stop-color="#6E98FF"/>
      <stop offset="1" stop-color="#4264DD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="627" y1="240" x2="1092" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A76FF" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#98BAFF" stop-opacity=".82"/>
      <stop offset="1" stop-color="#8F6BFF" stop-opacity=".06"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#nebula)"/>
  <g opacity=".55" stroke="#5570C8" stroke-width=".75">
    <path d="M0 69H1200M0 128H1200M0 188H1200M0 250H1200" opacity=".16"/>
    <path d="M706 305C699 220 728 88 895 46C1059 5 1151 106 1124 207C1092 327 835 324 746 243C657 162 725 55 864 37" opacity=".42"/>
    <ellipse cx="911" cy="153" rx="231" ry="91" transform="rotate(-17 911 153)" stroke="url(#ring)"/>
    <ellipse cx="911" cy="153" rx="168" ry="62" transform="rotate(22 911 153)" opacity=".55"/>
  </g>
  <g fill="#B9CEFF" opacity=".8">
    <circle cx="83" cy="66" r="1.4"/><circle cx="192" cy="250" r="1"/><circle cx="256" cy="56" r=".9"/><circle cx="429" cy="255" r="1.5"/>
    <circle cx="534" cy="80" r="1.1"/><circle cx="604" cy="225" r=".8"/><circle cx="747" cy="44" r="1.2"/><circle cx="1093" cy="57" r="1.2"/>
    <circle cx="1145" cy="254" r="1"/><circle cx="1048" cy="284" r="1.3"/><circle cx="704" cy="274" r=".9"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="911" cy="153" r="54" fill="url(#core)"/>
    <circle cx="911" cy="153" r="6" fill="#F9FCFF"/>
    <circle cx="1046" cy="105" r="4" fill="#F7D97A"/>
    <circle cx="780" cy="206" r="3.6" fill="#66EDC2"/>
    <circle cx="1008" cy="236" r="3" fill="#A791FF"/>
  </g>
  <g transform="translate(86 94)">
    <circle cx="27" cy="27" r="26" fill="#0D1731" stroke="#6D92F3" stroke-opacity=".65"/>
    <circle cx="27" cy="27" r="7" fill="#D9E7FF"/>
    <path d="M5 34C15 9 39 5 50 22M6 38C20 53 44 48 50 30" stroke="#80A6FF" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
    <text x="74" y="24" fill="#F3F6FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.2">GitGalaxy</text>
    <text x="76" y="51" fill="#9EB3DD" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="3">OPEN SOURCE OBSERVATORY</text>
  </g>
  <text x="87" y="231" fill="#CAD6EF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">Navigate the open-source universe.</text>
  <text x="87" y="261" fill="#7587AF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Every repository is a star. Every signal tells a story.</text>
</svg>
